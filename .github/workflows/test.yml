name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      SKIP_ALPINE_PROVIDER_TESTS:
        description: 'Skip alpine provider tests'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push build on master: a cancelled run reads as "superseded"
  # rather than "broken", which hides a regression in the commit it replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REACT_APP_API_BASE_URL: http://localhost:8080
  APP_SHA: ${{ github.sha }}
  APP_REF: ${{ github.ref }}
  LD_LIBRARY_PATH: /tmp
  PACT_GO_LIB_DOWNLOAD_PATH: /tmp
  LOG_LEVEL: error

jobs:
  complete:
    name: Test completion check
    if: always()

    permissions:
      contents: none

    runs-on: ubuntu-latest
    needs:
      - verify
      - test
      - test-containers

    steps:
      - name: Failed
        run: exit 1
        if: |
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - run: mise run verify

  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "1.26", "1.27"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GO_VERSION: ${{ matrix.go-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: APP_BRANCH=${APP_REF:11} mise run ci
      - name: Set CGO_LDFLAGS / pact_ffi lib on PATH
        if: matrix.os == 'windows-latest'
        run: |
          "CGO_LDFLAGS=-L$env:TMP" >> $env:GITHUB_ENV
          "$env:TMP" >> $env:GITHUB_PATH
      - name: Test (unit)
        if: matrix.os != 'ubuntu-latest'
        run: mise run test
      - name: Test (pact)
        if: matrix.os != 'ubuntu-latest'
        run: mise run pact-local
      - name: Test (examples coverage)
        run: mise run test-examples
      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: ./coverage.txt,./coverage-consumer.txt,./coverage-provider.txt
          flags: ${{ matrix.os }}-go${{ matrix.go-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # Tolerated until CODECOV_TOKEN is added to repository settings;
          # flip to true once uploads are confirmed working.
          fail_ci_if_error: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: logs-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go-version }}-${{ matrix.os }}.zip
          path: ~/.pact/plugins/**/plugin.log
        if: ${{ always() }}

  test-containers:
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.variant }}-${{ matrix.go-version }}-test-container
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        go-version: ["1.25", "1.26", "1.27"]
        variant: [debian]
        experimental: [false]
        include:
          - variant: alpine
            go-version: 1.25
            experimental: true
            os: ubuntu-latest
          - variant: alpine
            go-version: 1.26
            experimental: true
            os: ubuntu-latest
          - variant: alpine
            go-version: 1.27
            experimental: true
            os: ubuntu-latest
          - variant: alpine
            go-version: 1.25
            experimental: true
            os: ubuntu-24.04-arm
          - variant: alpine
            go-version: 1.26
            experimental: true
            os: ubuntu-24.04-arm
          - variant: alpine
            go-version: 1.27
            experimental: true
            os: ubuntu-24.04-arm
    env:
      GO_VERSION: ${{ matrix.go-version }}
      IMAGE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Test dockerfile
        run: |
          if [[ "${{ matrix.variant }}" == "alpine" ]]; then
            export SKIP_PROVIDER_TESTS=true
            if [[ "${{ github.event.inputs.SKIP_ALPINE_PROVIDER_TESTS }}" == "false" ]]; then
              export SKIP_PROVIDER_TESTS=false
            fi
          fi
          mise run docker-test-all
