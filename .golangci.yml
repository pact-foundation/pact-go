version: "2"
run:
  build-tags:
    - consumer
    - provider
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - bodyclose
    - dogsled
    - dupword
    - embeddedstructfieldcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funcorder
    - gocritic
    - godoclint
    - godot
    - goconst
    - gosec
    - inamedparam
    - intrange
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - noctx
    - noinlineerr
    - nonamedreturns
    - perfsprint
    - protogetter
    - revive
    - tagalign
    - testifylint
    - thelper
    - unconvert
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    mnd:
      ignored-functions:
        # File-permission arguments are already self-explanatory in octal
        # form (0o644, 0o755, ...); naming each one constant-per-call-site
        # would only rename the number, not clarify it.
        - 'os\.Chmod'
        - 'os\.MkdirAll'
        - 'os\.WriteFile'
    dupword:
      ignore:
        # utils/datetime.go documents a Java DateTimeFormatter symbol table where the
        # Meaning and Presentation columns both read "year" for the `u` symbol.
        - year
    # golangci-lint's revive settings replace revive's default rule set
    # rather than adding to it, so disabling one rule here means listing
    # every rule revive enables by default (per revive's own
    # config.defaultRules, github.com/mgechev/revive/config/config.go)
    # and disabling only the one we don't want. Leaving this list
    # incomplete silently turns revive off.
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
        # A named parameter is documentation on a public API: pkg.go.dev
        # renders it as part of the signature (e.g. `Verify(handle
        # *native.Verifier, writer outputWriter)`), even where the body
        # never reads it. Blanking it to `_` to satisfy this rule makes
        # the published signature worse, not better, so the rule is
        # disabled outright rather than fought function-by-function;
        # revive has no way to scope it to exported declarations only.
        # Unexported functions still get `_` renames by hand where a
        # parameter is genuinely unused and un-named.
        - name: unused-parameter
          disabled: true
  exclusions:
    paths:
      # lib.go only contains cgo annotations
      - internal/native/lib.go
    rules:
      # matchers/matcher.go switches over reflect.Kind to build Pact matchers.
      # Kinds with no JSON representation (Chan, Func, Complex*, ...) have no
      # meaningful matcher and are handled by an explicit default case; scoped
      # to this file only so exhaustive still catches a missing case in a real
      # enum switch (e.g. models.SpecificationVersion) elsewhere in the repo.
      - path: matchers/matcher\.go
        linters:
          - exhaustive
      # internal/native's ALL_CAPS constants (INTERACTION_PART_REQUEST,
      # LOG_LEVEL_*, MESSAGE_TYPE_*, ...) mirror the identifiers in the
      # pact_ffi C header they bind to, so a reader can audit the binding
      # against the FFI enum values. Scoped to var-naming only, and to this
      # package, since it isn't exported outside the module and the reason
      # doesn't apply anywhere else.
      - path: internal/native/
        linters:
          - revive
        text: "var-naming"
      # internal/native's switch statements match pact_ffi's C return codes,
      # each documented in a comment table directly above the switch; the
      # numbers are FFI enum values, not tunable magic numbers. Scoped to
      # case checks only, and to this package, matching the var-naming
      # exclusion above.
      - path: internal/native/
        linters:
          - mnd
        text: "in <case> detected"
      # Verbatim upstream gRPC route-guide example (Copyright gRPC authors):
      # the haversine formula's repeated `2`s and the 50051 default port are
      # standard for this example. Diverging from the original to name them
      # would trade a widely recognised reference implementation for no
      # readability gain.
      - path: examples/grpc/routeguide/server/server\.go
        linters:
          - mnd
      # Repeated literals in tests usually read better inline than behind a
      # shared constant name - a test asserting "application/json" states
      # its expectation literally rather than through an indirection.
      - path: _test\.go$
        linters:
          - goconst
formatters:
  enable:
    - gofumpt
