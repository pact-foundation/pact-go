services:
  httpbin:
    image: kong/httpbin@sha256:a6ac46531193a8009ca7d83d6a2d76b3114a7ab77c73aec5b8007c92206621f3 # https://github.com/Kong/httpbin
    ports:
      - "8000:80"

  postgres:
    image: postgres@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "postgres", "-h", "127.0.0.1" ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 30s
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres

  broker_app:
    image: pactfoundation/pact-broker:latest@sha256:420341d4fbfb00a621c313f47e530ad75703f969bbc7520d0d72bc71bb53cef9
    links:
      - postgres
    ports:
      - 80:9292
    environment:
      PACT_BROKER_BASIC_AUTH_USERNAME: pact_workshop
      PACT_BROKER_BASIC_AUTH_PASSWORD: pact_workshop
      PACT_BROKER_DATABASE_USERNAME: postgres
      PACT_BROKER_DATABASE_PASSWORD: password
      PACT_BROKER_DATABASE_HOST: postgres
      PACT_BROKER_DATABASE_NAME: postgres
    # The Pact Broker provides a healthcheck endpoint which we will use to wait
    # for it to become available before starting up
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://pact_workshop:pact_workshop@127.0.0.1:9292/diagnostic/status/heartbeat" ]
      interval: 2s
      timeout: 2s
      retries: 5
      # A cold boot takes the better part of a minute; without this the retries
      # are exhausted long before the app can answer.
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy